name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-readme:
    name: Validate README
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate README
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("README.md")
          if not path.is_file():
              raise SystemExit("README.md is missing")

          data = path.read_bytes()
          if not data:
              raise SystemExit("README.md is empty")

          try:
              text = data.decode("utf-8")
          except UnicodeDecodeError as exc:
              raise SystemExit(f"README.md is not valid UTF-8: {exc}") from exc

          if not text.strip():
              raise SystemExit("README.md contains only whitespace")

          if not data.endswith(b"\n"):
              raise SystemExit("README.md must end with a newline")

          conflict_marker = re.compile(r"^(<<<<<<<|=======|>>>>>>>)", re.MULTILINE)
          if conflict_marker.search(text):
              raise SystemExit("README.md contains a merge conflict marker")

          for line_number, line in enumerate(text.splitlines(), start=1):
              if line.endswith((" ", "\t")):
                  raise SystemExit(
                      f"README.md has trailing whitespace on line {line_number}"
                  )

          print("README.md validation passed")
          PY
